
<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>प्रदेश कार्यालय व्यवस्थापन | Province Office Management</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#eef1f5; --surface3:#e2e6ec;
  --border:#e0e4ea; --border2:#c9d0d9;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-glow:rgba(37,99,235,0.10);
  --accent:#c2410c; --accent2:#15803d; --accent3:#7c3aed; --accent4:#a15c07;
  --text:#111827; --text2:#4b5563; --text3:#6b7280;
  --red:#dc2626; --green:#15803d; --yellow:#b45309; --purple:#7c3aed;
  --shadow:0 4px 24px rgba(15,23,42,0.07);
  --r:12px; --r-sm:8px; --r-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ─── ACCESSIBILITY / MOTION ─── */
button,.nav-item,.btn,.icon-btn,.tab,.auth-tab,.lang-opt,.office-card,.pt-chip,.contact-btn,.upload-slot,.user-chip{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav-item:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,a:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
.icon-sm{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.icon-md{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-lg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ─── AUTH ─── */
#auth-screen{
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#eef2f7 0%,#ffffff 50%,#eef2f7 100%);
  padding:20px;overflow-y:auto;
}
.auth-glow{
  position:absolute;top:-100px;left:50%;transform:translateX(-50%);
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,0.10) 0%,transparent 70%);
  pointer-events:none;
}
.auth-logo{
  width:88px;height:88px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px rgba(37,99,235,0.15),0 0 40px rgba(37,99,235,0.12);
  overflow:hidden;margin-bottom:14px;flex:none;
}
.auth-logo img{width:100%;height:100%;object-fit:contain}
.auth-org{color:var(--primary);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-bottom:4px}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:3px}
.auth-sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:28px}
.auth-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:28px 24px;width:100%;max-width:380px;
  box-shadow:var(--shadow);position:relative;z-index:1;
}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--r-sm);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--text2);transition:all .2s}
.auth-tab.active{background:var(--surface2);color:var(--text)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.fg input,.fg select,.fg textarea{
  width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary)}
.fg select option{background:var(--surface2)}
.fg textarea{resize:vertical;min-height:70px}
.btn-primary{
  width:100%;padding:12px;background:var(--primary);color:#fff;border:none;
  border-radius:var(--r-sm);font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .2s,transform .1s;
}
.btn-primary:active{transform:scale(.98)}
.btn-primary:hover{background:var(--primary-d)}
.auth-err{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:var(--red);padding:9px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:600;margin-bottom:12px;display:none;text-align:center}
.auth-ok{background:rgba(21,128,61,.1);border:1px solid rgba(21,128,61,.3);color:var(--green);padding:9px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:600;margin-bottom:12px;display:none;text-align:center}
.otp-row{display:flex;gap:8px;margin-bottom:12px}
.otp-single-input{
  width:100%;padding:12px 14px;text-align:center;font-size:22px;font-weight:700;
  letter-spacing:10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;outline:none;
  transition:border-color .15s ease;
}
.otp-single-input::placeholder{color:var(--text3);letter-spacing:6px;font-weight:400}
.otp-single-input:focus{border-color:var(--primary)}
.otp-single-input::-webkit-outer-spin-button,
.otp-single-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.otp-single-input[type=number]{-moz-appearance:textfield;appearance:textfield}
.otp-row input:focus{border-color:var(--primary)}
.otp-hint{font-size:11px;color:var(--text3);margin-bottom:10px;padding:8px;background:rgba(37,99,235,.08);border-radius:6px;font-family:'DM Mono',monospace}
.link-btn{background:none;border:none;color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report-filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.report-filter-grid{grid-template-columns:1fr 1fr}}

/* ─── APP SHELL ─── */
#app{height:100vh;display:none;flex-direction:column}
.top-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 14px;display:flex;align-items:center;gap:10px;
  min-height:52px;flex:none;position:sticky;top:0;z-index:100;
}
.top-logo{width:34px;height:34px;border-radius:50%;background:#fff;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.top-logo img{width:100%;height:100%;object-fit:contain}
.top-org{flex:1;overflow:hidden}
.top-org-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-org-sub{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.fy-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-weight:600;font-family:inherit;padding:6px 8px;cursor:pointer}
.fy-select:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r-sm);background:transparent;border:none;
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .2s,color .2s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.lang-pill{display:flex;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.lang-opt{padding:5px 9px;border:none;background:transparent;color:var(--text2);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.lang-opt.active{background:var(--primary);color:#fff}
.user-chip{
  display:flex;align-items:center;gap:7px;padding:5px 10px;
  background:var(--surface2);border-radius:20px;cursor:pointer;border:1px solid var(--border);
}
.user-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.user-name{font-size:12px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── LAYOUT ─── */
.app-body{flex:1;display:flex;overflow:hidden}
.sidebar{
  width:220px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex:none;overflow-y:auto;
}
@media(max-width:640px){
  .sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .25s;width:240px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block!important}
}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:89;top:52px}
.sidebar-section{padding:10px 8px 4px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);
  margin:1px 6px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;
  transition:all .15s;border:none;background:transparent;font-family:inherit;width:calc(100% - 12px);text-align:left;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--primary-glow);color:var(--primary);font-weight:600}
.nav-item .ni-icon{font-size:15px;flex:none;width:20px;text-align:center}
.nav-item .ni-badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.main{flex:1;overflow-y:auto;padding:16px}

/* ─── CARDS & SECTIONS ─── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:var(--r-sm);border:none;font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .15s;
}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-pr{background:var(--primary);color:#fff}
.btn-pr:hover{background:var(--primary-d)}
.btn-out{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-out:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:rgba(220,38,38,.15);color:var(--red);border:1px solid rgba(220,38,38,.3)}
.btn-danger:hover{background:rgba(220,38,38,.25)}
.btn-success{background:rgba(21,128,61,.15);color:var(--green);border:1px solid rgba(21,128,61,.3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc,var(--primary))}
.stat-val{font-size:26px;font-weight:800;line-height:1;font-family:'DM Mono',monospace}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:4px}
.stat-icon{position:absolute;top:12px;right:12px;font-size:20px;opacity:.2}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag-blue{background:rgba(37,99,235,.12);color:var(--primary)}
.tag-green{background:rgba(21,128,61,.12);color:var(--green)}
.tag-red{background:rgba(220,38,38,.12);color:var(--red)}
.tag-yellow{background:rgba(180,83,9,.12);color:var(--yellow)}
.tag-purple{background:rgba(124,58,237,.12);color:var(--accent3)}
.tag-orange{background:rgba(217,119,6,.12);color:var(--accent4)}
.badge-role{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}

/* ─── TABLE ─── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(15,23,42,.035)}
.td-actions{display:flex;gap:5px;flex-wrap:wrap}
.td-mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2)}

/* ─── SEARCH / FILTER ─── */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-box{
  flex:1;min-width:160px;padding:8px 12px 8px 34px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;
  font-family:inherit;color:var(--text);outline:none;position:relative;
}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-box:focus{border-color:var(--primary)}
.filter-select{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-family:inherit;color:var(--text);outline:none}
.filter-select:focus{border-color:var(--primary)}
.filter-select option{background:var(--surface2)}

/* ─── MODAL ─── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:500;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
@media(min-width:640px){
  .modal-overlay{align-items:center}
  .modal-sheet{border-radius:var(--r-lg)!important;max-height:90vh}
}
.modal-sheet{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  width:100%;max-width:580px;max-height:90vh;
  overflow-y:auto;padding:20px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:var(--surface2);border:none;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center}
.form-section{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.theme-purple{--primary:var(--purple)}
.theme-purple .form-section{color:var(--purple);border-bottom-color:rgba(124,58,237,.35)}
.theme-purple .fg label{color:var(--purple)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}

/* ─── FILE UPLOAD ─── */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.upload-slot{
  border:1.5px dashed var(--border2);border-radius:var(--r-sm);padding:14px 10px;
  text-align:center;cursor:pointer;position:relative;transition:border-color .2s,background .2s;
  background:var(--bg);
}
.upload-slot:hover{border-color:var(--primary);background:var(--primary-glow)}
.upload-slot.has-file{border-color:var(--green);border-style:solid;background:rgba(21,128,61,.05)}
.upload-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up-icon{font-size:22px;margin-bottom:5px}
.up-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.up-name{font-size:10px;color:var(--green);font-weight:600;margin-top:3px;word-break:break-all}

/* ─── PROGRESS BAR ─── */
.prog-bar-bg{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-bar-fill{height:100%;border-radius:3px;transition:width .5s}

/* ─── OFFICE CARD ─── */
.office-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;
}
.office-card:hover{border-color:var(--primary);background:rgba(37,99,235,.03)}
.office-card.selected{border-color:var(--primary);background:var(--primary-glow)}
.office-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.office-name{font-size:14px;font-weight:700}
.office-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
.office-meta span{display:flex;align-items:center;gap:4px}

/* ─── CONTACT ACTIONS ─── */
.contact-btns{display:flex;gap:6px}
.contact-btn{
  width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;text-decoration:none;
  transition:transform .15s;flex:none;
}
.contact-btn:active{transform:scale(.9)}
.cb-call{background:rgba(21,128,61,.2)}
.cb-sms{background:rgba(37,99,235,.2)}
.cb-mail{background:rgba(124,58,237,.2)}

/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px;margin-top:6px}

/* ─── TOAST ─── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:600;
  box-shadow:var(--shadow);z-index:900;transition:transform .3s;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ─── ACCESS CONTROL ─── */
.ac-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.ac-row:last-child{border-bottom:none}
.ac-user{flex:1;font-size:13px;font-weight:600}
.ac-toggle{display:flex;gap:4px;flex-wrap:wrap}
.ac-chip{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;transition:all .15s}
.ac-chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ─── PROJECT TYPE CHIPS ─── */
.pt-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pt-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.pt-chip.selected{background:var(--primary-glow);border-color:var(--primary);color:var(--primary)}
.pt-chip .del-pt{color:var(--red);font-size:14px;font-weight:700;margin-left:2px}

/* ─── MISC ─── */
.divider{height:1px;background:var(--border);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill-num{background:rgba(37,99,235,.12);color:var(--primary);font-family:'DM Mono',monospace;font-size:10px}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:12px;font-size:12px}
.detail-row:last-child{border-bottom:none}
.dk{color:var(--text2);font-weight:600;flex:none;width:130px}
.dv{color:var(--text);font-weight:500;text-align:right;word-break:break-word}
.no-scroll{overflow:hidden}

/* ─── BOOT LOADING ─── */
#boot-loading{
  position:fixed;inset:0;z-index:2000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.boot-spinner{width:38px;height:38px;border:3px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot-loading p{color:var(--text2);font-size:13px}
#boot-error{display:none;max-width:340px;text-align:center;color:var(--red);font-size:12px;padding:0 20px}
</style>

  <div class="auth-org" id="aorg">Province Government</div>
  <div class="auth-title" id="atitle">Office Management System</div>
  <div class="auth-sub" id="asub">Ministry of Physical Infrastructure Development</div>

  <div class="auth-card">
    <div class="auth-tabs" style="display:none">
      <button class="auth-tab active" id="tab-login-btn" onclick="showTab('login')">Login</button>
      <button class="auth-tab" id="tab-signup-btn" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="login-panel">
      <div class="auth-err" id="login-err"></div>
      <div id="login-form-div">
        <div class="fg"><label>Province</label>
          <select id="l-province">
            <option value="">— Select Province —</option>
            <option value="Koshi Province">Koshi Province</option>
            <option value="Madhesh Province">Madhesh Province</option>
            <option value="Bagmati Province">Bagmati Province</option>
            <option value="Gandaki Province">Gandaki Province</option>
            <option value="Lumbini Province">Lumbini Province</option>
            <option value="Karnali Province">Karnali Province</option>
            <option value="Sudurpashchim Province">Sudurpashchim Province</option>
          </select>
        </div>
        <div class="fg"><label id="ll-uid">User ID / Email</label>
          <input id="l-uid" placeholder="Enter user ID" oninput="lookupPayingOffice()">
          <div id="l-office-result" style="display:none;margin-top:8px;padding:8px 11px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.25);border-radius:6px;font-size:12px;color:var(--primary)"></div>
        </div>
        <div class="fg"><label id="ll-pwd">Password</label><input type="password" id="l-pwd" placeholder="Password"></div>
        <button class="btn-primary" onclick="loginStep1()">Continue →</button>
      </div>
      <div id="login-otp-div" style="display:none">
        <div class="otp-hint" id="login-otp-hint"></div>
        <div class="otp-row" id="login-otp-inputs"></div>
        <button class="btn-primary" onclick="loginOTPVerify()">Verify & Sign In</button>
        <div style="text-align:center;margin-top:10px"><button class="link-btn" onclick="resendOTP('login')">Resend OTP</button></div>
      </div>
    </div>

    <!-- SIGNUP -->
    <div id="signup-panel" style="display:none">
      <div class="auth-err" id="signup-err"></div>
      <div class="auth-ok" id="signup-ok"></div>
      <div id="signup-form-div">
        <div class="grid2">
          <div class="fg"><label>Full Name</label><input id="su-name" placeholder="Your name"></div>
          <div class="fg"><label>User ID</label><input id="su-uid" placeholder="Choose ID"></div>
        </div>
        <div class="fg"><label>Email</label><input type="email" id="su-email" placeholder="you@email.com"></div>
        <div class="fg"><label>Phone</label><input type="tel" id="su-phone" placeholder="98XXXXXXXX"></div>
        <div class="grid2">
          <div class="fg"><label>Password</label><input type="password" id="su-pwd" placeholder="Min 6 chars"></div>
          <div class="fg"><label>Confirm</label><input type="password" id="su-pwd2" placeholder="Repeat"></div>
        </div>
        <div class="fg"><label>Office</label>
          <select id="su-office"><option value="">— Select Office —</option></select>
        </div>
        <button class="btn-primary" onclick="signupStep1()">Create Account →</button>
      </div>
      <div id="signup-otp-div" style="display:none">
        <div class="otp-hint" id="signup-otp-hint"></div>
        <div class="otp-row" id="signup-otp-inputs"></div>
        <button class="btn-primary" onclick="signupOTPVerify()">Verify & Activate</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CLOUD DATABASE (shared across every device/desktop)
// ════════════════════════════════════════════════════════
// 1. Go to https://console.firebase.google.com → "Add project" (free).
// 2. In the project: Build → Realtime Database → "Create Database" → start in TEST mode.
// 3. Project settings (gear icon) → "Your apps" → Web (</>) → copy the config object.
// 4. Paste your own values below, replacing the placeholders. Redeploy the file.
const firebaseConfig = {
  apiKey: "AIzaSyAUUGEuhTJx2RJI-sy1GBdVeGlWkWFZSew",
  authDomain: "multioffice-udbo.firebaseapp.com",
  databaseURL: "https://multioffice-udbo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "multioffice-udbo",
  storageBucket: "multioffice-udbo.firebasestorage.app",
  messagingSenderId: "555082373932",
  appId: "1:555082373932:web:a1f7431d713011fc982a89"
};
let fbdb=null, CLOUD_OK=false, FB_INIT_ERROR=null;
try{
  if(typeof firebase==='undefined'){
    throw new Error('Firebase SDK script did not load — check your internet connection, or gstatic.com/jsdelivr.net may be blocked on this network.');
  }
  firebase.initializeApp(firebaseConfig);
  fbdb=firebase.database();
  CLOUD_OK = !firebaseConfig.apiKey.includes('YOUR_API_KEY');
}catch(e){
  console.error('Firebase init failed',e);
  FB_INIT_ERROR = e.message;
}

// In-memory mirror of the cloud database (kept in sync via a realtime listener)
let DB = {};

// Falls back to this browser's localStorage ONLY if no Firebase config was set,
// so the app still runs for local testing — but on a real deployment you MUST
// fill in firebaseConfig above or data will stay stuck on one device again.
const LS = {
  get(k,def=null){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){return def;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};

function setPath(key,value){
  DB[key]=value;
  if(CLOUD_OK && fbdb){
    fbdb.ref(key).set(value).catch(err=>{
      console.error('Cloud sync failed',err);
      toast('⚠️ Could not save to server — check internet connection','var(--red)');
    });
  } else {
    LS.set('oms_'+key,value);
  }
}

async function loadDB(){
  if(CLOUD_OK && fbdb){
    let authErr=null;
    for(let attempt=1; attempt<=3; attempt++){
      try{
        await firebase.auth().signInAnonymously();
        authErr=null;
        break;
      }catch(e){
        authErr=e;
        console.error('Firebase auth attempt',attempt,'failed',e);
        if(attempt<3) await new Promise(r=>setTimeout(r, 1000*attempt));
      }
    }
    if(authErr){
      if(authErr.code==='auth/network-request-failed'){
        throw new Error('This network/browser cannot reach Firebase\'s authentication servers (identitytoolkit.googleapis.com). If you are testing inside a preview or sandbox tool, open the real deployed link directly instead. Otherwise check your firewall/network for blocked Google API domains, then reload.');
      }
      if(authErr.code==='auth/admin-restricted-operation' || authErr.code==='auth/operation-not-allowed'){
        throw new Error('Anonymous sign-in is not enabled yet. In your Firebase console, go to Build → Authentication → Sign-in method, and enable "Anonymous".');
      }
      throw new Error('Could not authenticate with the database ('+(authErr.code||authErr.message)+').');
    }
    const snap = await fbdb.ref().once('value');
    DB = snap.val() || {};
    // live sync: whenever ANY device changes data, refresh this device automatically
    fbdb.ref().on('value',snap=>{
      DB = snap.val() || {};
      const modalOpen = document.getElementById('modal')?.classList.contains('open');
      if(CU && !modalOpen) nav(CPage);
    });
  } else {

const FISCAL_YEARS=[]; for(let y=2083;y<=2092;y++) FISCAL_YEARS.push(`${y}/${(y+1).toString().slice(-2)}`);

function populateFYSelect(){
  const sel=document.getElementById('fy-select');

}

// Projects saved before this feature existed have no fiscalYear — treat them as
// belonging to the earliest fiscal year so they don't just vanish from every view.

function fyFilter(arr){ return arr.filter(p=>fyOf(p)===CFY); }

function uid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function genOTP(){return String(Math.floor(100000+Math.random()*900000))}
function fmt(n){if(!n||n===0)return '—'; const c=n/10000000; if(c>=1)return c.toFixed(2)+' Cr NPR'; const l=n/100000; if(l>=1)return l.toFixed(2)+' L NPR'; return n.toLocaleString()+' NPR';}
function pct(n){return n===null||n===undefined?'—':Math.round(n*100)+'%'}
function myOffice(){return CU&&CU.officeId ? gO().find(o=>o.id===CU.officeId) : null}
function canEdit(){return CU&&(CU.role==='superadmin'||CU.role==='admin')}
function hasAccess(section){
  if(!CU) return false;
  if(CU.role==='superadmin'||CU.role==='admin') return true;
  return !!(CU.access&&CU.access[section]);
}
function filterByOffice(arr){
  if(!CU) return [];
  if(CU.role==='superadmin') return arr;
  return arr.filter(p=>p.officeId===CU.officeId);
}
function officeName(id){ const o=gO().find(o=>o.id===id); return o?o.name:'—';}
function statusTag(s){
  if(!s) return '';
  if(s==='Running'||s==='चलिरहेको') return `<span class="tag tag-blue">${s}</span>`;
  if(s==='Complete'||s==='सम्पन्न') return `<span class="tag tag-green">${s}</span>`;
  return `<span class="tag tag-yellow">${s}</span>`;
}
function avatarColor(name){ const colors=['#2f81f7','#3fb950','#f78166','#d2a8ff','#ffa657','#79c0ff']; let h=0; for(let c of name) h=(h+c.charCodeAt(0))%colors.length; return colors[h];}

function buildOTPInputs(containerId){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  const inp=document.createElement('input');
  inp.type='text'; inp.inputMode='numeric'; inp.pattern='[0-9]*';
  inp.autocomplete='one-time-code'; inp.maxLength=6;
  inp.id=`otp_${containerId}`;
  inp.className='otp-single-input';
  inp.placeholder='• • • • • •';
  inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,6); };
  el.appendChild(inp);
}
function getOTPVal(containerId){ const el=document.getElementById(`otp_${containerId}`); return el?el.value:''; }

  document.getElementById('tab-login-btn').classList.toggle('active',tab==='login');

let _officeLookupTimer=null;
// Looks up the real user record by uid/email and shows the office that
// administers/pays them, live as the person types their username.
function lookupPayingOffice(){
  clearTimeout(_officeLookupTimer);
  _officeLookupTimer=setTimeout(()=>{
    const box=document.getElementById('l-office-result');
    if(!box) return;
    const entered=(document.getElementById('l-uid')?.value||'').trim().toLowerCase();
    if(!entered){ box.style.display='none'; return; }
    const users=gU();
    const match=Object.values(users).find(u=>u.uid.toLowerCase()===entered||(u.email||'').toLowerCase()===entered);
    if(!match){
      box.textContent='No office found for this username';
      box.style.cssText='display:block;margin-top:8px;padding:8px 11px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:6px;font-size:12px;color:var(--red)';
      return;
    }
    const office=gO().find(o=>o.id===match.officeId);
    box.textContent='🏢 '+(office?office.name:'Provincial Head Office (no single office assigned)');
    box.style.cssText='display:block;margin-top:8px;padding:8px 11px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.25);border-radius:6px;font-size:12px;color:var(--primary)';
  },300);
}

//  PROVINCE LOGIN CHECK (no GPS/location dependency)
//  Compares the province selected on the login form against the
//  province of the office the account is actually assigned to.
// ════════════════════════════════════════════════════════
function getUserProvince(u){
  if(!u) return null;
  if(u.role==='superadmin') return null; // superadmin isn't tied to one office/province
  const office=gO().find(o=>o.id===u.officeId);
  return office?.province||null;
}
function provinceErrorText(reason){
  switch(reason){
    case 'mismatch': return '🚫 Access Restricted: the selected province does not match your assigned office\'s province.';
    case 'unassigned': return '🚫 Access Restricted: your office has no province assigned yet. Please contact a super admin to set it before signing in.';
    default: return '🚫 Access Restricted: could not verify your province.';
  }
}

function loginStep1(){
  const province=document.getElementById('l-province')?.value;
  const uid=document.getElementById('l-uid').value.trim();
  const pwd=document.getElementById('l-pwd').value;
  const err=document.getElementById('login-err');
  if(!province){ err.style.display='block'; err.textContent='Please select your province.'; return; }
  const users=gU();
  const u=Object.values(users).find(u=>(u.uid===uid||u.email===uid)&&u.pwd===pwd&&u.active!==false);
  if(!u){ err.style.display='block'; err.textContent=LANG==='en'?'Invalid credentials':'गलत प्रयोगकर्ता नाम वा पासवर्ड'; return; }

  err.style.display='none';
  const userProvince=getUserProvince(u);
  if(u.role!=='superadmin'){
    if(!userProvince){ err.style.display='block'; err.textContent=provinceErrorText('unassigned'); return; }
    if(userProvince!==province){ err.style.display='block'; err.textContent=provinceErrorText('mismatch'); return; }
  }

  _pending=u;
  _otp=genOTP();
  document.getElementById('login-form-div').style.display='none';
  document.getElementById('login-otp-div').style.display='block';
  buildOTPInputs('login-otp-inputs');
  document.getElementById('login-otp-hint').textContent=`OTP Number: ${_otp}`;
  document.getElementById(`otp_login-otp-inputs`)?.focus();
}
function loginOTPVerify(){
  const entered=getOTPVal('login-otp-inputs');
  if(entered===_otp){ loginSuccess(_pending); }
  else { document.getElementById('login-err').style.display='block'; document.getElementById('login-err').textContent='Incorrect OTP'; }
}
function resendOTP(type){ _otp=genOTP(); const hintId=type==='login'?'login-otp-hint':'signup-otp-hint'; document.getElementById(hintId).textContent=`OTP Number: ${_otp}`; }

function reportAllRows(){
  const offices=gO();
  const withMeta=(arr,ptypeKey)=>filterByOffice(arr).map(p=>{
    const office=offices.find(o=>o.id===p.officeId);
    return {
      ...p,
      _ptype:ptypeKey,
      _district:p.district||office?.district||'',
      _typeName:gPT().find(pt=>pt.id===p.type)?.name||'—',
      _officeName:office?office.name:'—',
    };
  });
  return fyFilter([...withMeta(gNCB(),'ncb'),...withMeta(gSQ(),'sq'),...withMeta(gCC(),'cc')]);
}
function reportFilteredRows(){
  const ptypeF=document.getElementById('rpt-ptype')?.value||'all';
  const districtF=document.getElementById('rpt-district')?.value||'all';
  const natureF=document.getElementById('rpt-nature')?.value||'all';
  const statusF=document.getElementById('rpt-status')?.value||'all';
  return reportAllRows().filter(p=>
    (ptypeF==='all'||p._ptype===ptypeF) &&
    (districtF==='all'||p._district===districtF) &&
    (natureF==='all'||p.type===natureF) &&
    (statusF==='all'||p.status===statusF)
  );
}
function reportSummaryHTML(rows){
  const running=rows.filter(p=>p.status==='Running').length;
  const complete=rows.filter(p=>p.status==='Complete').length;
  const pending=rows.filter(p=>p.status==='Pending').length;
  return `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--text2)">
    <span><strong style="color:var(--text)">${rows.length}</strong> total</span>
    <span>🔄 <strong style="color:var(--text)">${running}</strong> running</span>
    <span>✅ <strong style="color:var(--text)">${complete}</strong> completed</span>
    <span>⏳ <strong style="color:var(--text)">${pending}</strong> pending</span>
  </div>`;
}
function reportTableHTML(rows){
  const isSA=CU.role==='superadmin';
  if(!rows.length) return `${reportSummaryHTML(rows)}<div class="empty-state" style="padding:30px 0"><div class="es-icon">📭</div><div>No projects match these filters</div></div>`;
  return `${reportSummaryHTML(rows)}<div class="tbl-wrap"><table>

function printReport(){

      .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin:10px 0 4px;border-bottom:1px solid #ddd;padding-bottom:2px;width:100%}

function saveOffice(id){
  const val=v=>document.getElementById(v)?.value?.trim();
  if(!val('of-name')){toast('Name required','var(--red)');return;}
  const offices=gO();
  const obj={id:id||uid(),province:val('of-province'),name:val('of-name'),nameNp:val('of-nameNp'),district:val('of-district'),address:val('of-address'),phone:val('of-phone'),email:val('of-email'),adminId:val('of-admin')};
  if(id){ const i=offices.findIndex(o=>o.id===id); if(i>=0) offices[i]=obj; }
  else offices.push(obj);
  setPath('offices',offices); closeModal(); nav('offices'); toast('Office saved ✅');
}

function deleteOffice(id){
  if(!confirm('Delete this office?')) return;
  setPath('offices',gO().filter(o=>o.id!==id)); nav('offices'); toast('Office deleted');
}

function renderUsersRows(users){

  return users.map((u,i)=>`<tr>

    </div></td>
    <td class="td-mono">${u.uid}</td>
    <td><span class="badge-role" style="background:${roleBg[u.role]||'var(--text3)'};color:#fff">${u.role}</span></td>

    </div></td>
  </tr>`).join('');
}

function filterUsers(){
  const q=(document.getElementById('user-search')?.value||'').toLowerCase();
  const role=(document.getElementById('user-role-filter')?.value||'');
  let users=Object.values(gU());
  if(q) users=users.filter(u=>u.name.toLowerCase().includes(q)||u.uid.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
  if(role) users=users.filter(u=>u.role===role);
  const tb=document.getElementById('users-tbody');
  if(tb) tb.innerHTML=renderUsersRows(users);
}

function saveUser(editUid){
  const v=id=>document.getElementById(id)?.value?.trim();
  const users=gU();
  const thisUid=editUid||v('nu-uid');
  if(!thisUid||!v('nu-name')){toast('Name and User ID required','var(--red)');return;}
  if(!editUid && users[thisUid]){toast('User ID taken','var(--red)');return;}
  const existing=editUid?users[editUid]:{};
  const newPwd=v('nu-pwd');
  users[thisUid]={
    ...existing,
    uid:thisUid, name:v('nu-name'), email:v('nu-email'), phone:v('nu-phone'),
    role:v('nu-role'), officeId:v('nu-office')||null,
    active:document.getElementById('nu-active')?document.getElementById('nu-active').value==='true':true,
    pwd:newPwd||(existing.pwd||'changeme'),
    access:existing.access||{ncb:true,sq:true,cc:true,employees:false}
  };
  setPath('users',users); closeModal(); nav('users'); toast('User saved ✅');
}

  if(!confirm('Delete user '+uid+'?')) return;
  const users=gU(); delete users[uid]; setPath('users',users); nav('users'); toast('User deleted');
}

// English amount-in-words using the Lakh/Crore grouping conventionally used on
// Nepali bank guarantees and cheques (not the Western million/billion grouping).
function numberToWordsEnglish(num){
  num=Math.round(Number(num)||0);
  if(num===0) return 'Zero Rupees Only';
  if(num<0) return 'Minus '+numberToWordsEnglish(-num);
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const twoDig=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  const threeDig=n=>{ let s=''; if(n>=100){ s+=ones[Math.floor(n/100)]+' Hundred'; n%=100; if(n) s+=' '; } if(n>0) s+=twoDig(n); return s; };
  let n=num;
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thousand=Math.floor(n/1000); n%=1000;
  const rest=n;
  const parts=[];
  if(crore) parts.push(threeDig(crore)+' Crore');
  if(lakh) parts.push(threeDig(lakh)+' Lakh');
  if(thousand) parts.push(threeDig(thousand)+' Thousand');
  if(rest) parts.push(threeDig(rest));
  return parts.join(' ')+' Rupees Only';
}
function updateAmountWords(inputId,displayId){
  const inp=document.getElementById(inputId), disp=document.getElementById(displayId);
  if(!inp||!disp) return;
  disp.textContent=inp.value?numberToWordsEnglish(inp.value):'';
}

// ════════════════════════════════════════════════════════
//  OFFLINE ROMAN → DEVANAGARI PHONETIC TRANSLITERATION ENGINE
//  (sound-based conversion, e.g. "kathmandu" -> "कठमाडु" —
//   NOT a meaning-based translator; that would need a live API)
// ════════════════════════════════════════════════════════
const NT_VOWELS=[['aa','आ'],['ee','ई'],['oo','ऊ'],['ai','ऐ'],['au','औ'],['a','अ'],['i','इ'],['u','उ'],['e','ए'],['o','ओ']];
const NT_MATRAS={aa:'ा',ee:'ी',oo:'ू',ai:'ै',au:'ौ',i:'ि',u:'ु',e:'े',o:'ो',a:''};
const NT_CONSONANTS=[
  ['ksh','क्ष'],['gya','ज्ञ'],['jny','ज्ञ'],['chh','छ'],
  ['kh','ख'],['gh','घ'],['ng','ङ'],['ch','च'],['jh','झ'],['ny','ञ'],
  ['th','थ'],['dh','ध'],['ph','फ'],['bh','भ'],['sh','श'],
  ['k','क'],['g','ग'],['c','च'],['j','ज'],['t','त'],['d','द'],['n','न'],
  ['p','प'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],
  ['v','व'],['w','व'],['s','स'],['h','ह'],['f','फ'],['z','ज'],
  ['x','क्स'],['q','क'],
];
function ntTransliterateWord(word){
  let i=0,out='',n=word.length;
  while(i<n){
    let matched=false;
    // Try a standalone vowel first (word start, or right after any completed syllable)
    for(const [rom,dev] of NT_VOWELS){
      if(word.substr(i,rom.length).toLowerCase()===rom){ out+=dev; i+=rom.length; matched=true; break; }
    }
    if(matched) continue;
    // Try a consonant, then greedily absorb any vowel matra that follows it
    for(const [rom,dev] of NT_CONSONANTS){
      if(word.substr(i,rom.length).toLowerCase()===rom){
        out+=dev; i+=rom.length;
        let matraMatched=false;
        for(const [vrom] of NT_VOWELS){
          if(word.substr(i,vrom.length).toLowerCase()===vrom){ out+=NT_MATRAS[vrom]; i+=vrom.length; matraMatched=true; break; }
        }
        if(!matraMatched && i<n) out+='्'; // halant — chains into next consonant (conjunct)
        matched=true; break;
      }
    }
    if(matched) continue;
    out+=word[i]; i++; // pass through digits/punctuation/unknown chars unchanged
  }
  return out;
}

function transliterateToNepali(text){
  if(!text) return '';
  const tokens=text.match(/[A-Za-z]+|[^A-Za-z]+/g)||[];
  const wordIdx=[]; tokens.forEach((tok,i)=>{ if(/[A-Za-z]/.test(tok)) wordIdx.push(i); });
  const out=tokens.slice();
  let wi=0;
  while(wi<wordIdx.length){
    let matchedSpan=0, matchedVal=null;
    for(let span=Math.min(4,wordIdx.length-wi);span>=1;span--){
      const idxs=wordIdx.slice(wi,wi+span);
      const phrase=idxs.map(i=>tokens[i]).join(' ').toLowerCase();
      if(NT_DICTIONARY[phrase]){ matchedSpan=span; matchedVal=NT_DICTIONARY[phrase]; break; }
    }
    if(matchedVal){
      const first=wordIdx[wi], last=wordIdx[wi+matchedSpan-1];
      out[first]=matchedVal;
      for(let k=first+1;k<=last;k++) out[k]='';
      // avoid a doubled ")" when the dictionary value already closes its own bracket
      if(matchedVal.trim().endsWith(')') && out[last+1] && /^\s*\)/.test(out[last+1])){
        out[last+1]=out[last+1].replace(/^(\s*)\)/,'$1');
      }
      wi+=matchedSpan;
    } else {
      const idx=wordIdx[wi];
      out[idx]=ntTransliterateWord(tokens[idx]);
      wi+=1;
    }
  }
  return out.join('');
}
// Auto-fills a Nepali field from its English sibling, unless the person has already
// typed into the Nepali field themselves (tracked via a data-attribute "dirty" flag).
function ntAuto(srcEl,targetId){
  const target=document.getElementById(targetId);
  if(!target || target.dataset.userEdited==='1') return;
  target.value=transliterateToNepali(srcEl.value);
}
function ntMarkEdited(el){ el.dataset.userEdited='1'; }
// Wires live transliteration listeners for the NCB form. Called right after the
// Add/Edit Project modal is rendered so the target elements already exist in the DOM.
function wireNCBTransliteration(){
  const pairs=[
    ['pj-name','pj-nameNp'],
    ['pj-contractorName','pj-contractorNameNp'],
    ['pj-proprietorName','pj-proprietorNameNp'],
    ['pj-officer','pj-officerNp'],
    ['pj-remarks','pj-remarksNp'],
  ];
  pairs.forEach(([srcId,targetId])=>{
    const src=document.getElementById(srcId), target=document.getElementById(targetId);
    if(!src||!target) return;
    if(target.value && target.value.trim()) target.dataset.userEdited='1'; // don't clobber existing saved Nepali text
    src.addEventListener('input',()=>ntAuto(src,targetId));
    target.addEventListener('input',()=>ntMarkEdited(target));
  });
  // District has two possible English sources: the standard dropdown, or the
  // free-text "Other" box that appears when a custom district is typed.
  const distSel=document.getElementById('pj-district');
  const distCustom=document.getElementById('pj-district-custom');
  const distNp=document.getElementById('pj-districtNp');
  if(distNp){
    if(distNp.value && distNp.value.trim()) distNp.dataset.userEdited='1';
    if(distSel) distSel.addEventListener('change',()=>{
      if(distSel.value && distSel.value!=='__custom__') ntAuto({value:distSel.options[distSel.selectedIndex].text},'pj-districtNp');
    });
    if(distCustom) distCustom.addEventListener('input',()=>ntAuto(distCustom,'pj-districtNp'));
    distNp.addEventListener('input',()=>ntMarkEdited(distNp));
  }
}

function toggleCustomInput(selectId,inputId,inputId2){
  const sel=document.getElementById(selectId), inp=document.getElementById(inputId);
  if(!sel||!inp) return;
  const inp2=inputId2?document.getElementById(inputId2):null;
  if(sel.value==='__custom__'){ inp.style.display='block'; inp.focus(); if(inp2) inp2.style.display='block'; }
  else { inp.style.display='none'; inp.value=''; if(inp2){ inp2.style.display='none'; inp2.value=''; } }
}
function getSelectOrCustom(selectId,inputId){
  const sel=document.getElementById(selectId);

  if(sel.value==='__custom__') return (document.getElementById(inputId)?.value||'').trim();
  return sel.value;
}
function resolveProjectType(rawTypeVal,rawTypeValNp){
  const pts=gPT();
  if(pts.some(p=>p.id===rawTypeVal)) return rawTypeVal;
  const name=(rawTypeVal||'').trim();
  if(!name) return '';
  const nameNp=(rawTypeValNp||'').trim()||name;
  const newPt={id:uid(),name,nameNp};
  pts.push(newPt); setPath('project_types',pts);
  return newPt.id;
}

function countProjectFiles(files){
  if(!files) return 0;

function openProjectDocuments(ptype,id){
  const p=PROJ_LABELS[ptype].get().find(x=>x.id===id); if(!p||!p.files) return;
  const slotMeta=key=>NCB_DOC_SLOTS.find(s=>s.key===key)||{label:key,icon:'📎'};
  const rows=Object.entries(p.files).map(([key,val])=>{
    if(!val) return '';
    const slot=slotMeta(key);
    const items=Array.isArray(val)?val:[val];
    if(!items.length) return '';
    const isPhotos=key==='sitePhotos';
    return `<div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px">${slot.icon} ${slot.label}${items.length>1?` (${items.length})`:''}</div>

      </div>`:`<div style="display:flex;flex-direction:column;gap:6px">

          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>

            <a href="${f.data}" target="_blank" class="btn btn-sm btn-out">View</a>
            <a href="${f.data}" download="${f.name}" class="btn btn-sm btn-out">Download</a>
          </span>`:`<span style="font-size:10px;color:var(--text3);flex:none">uploaded before file storage was enabled</span>`}
        </div>`).join('')}
      </div>`}
    </div>`;
  }).join('');
  openModal(`📎 Documents — ${p.name}`,`
    ${rows||'<div class="empty-state" style="padding:20px 0"><div class="es-icon">📭</div><div>No documents uploaded yet</div></div>'}
    <div class="modal-footer"><button class="btn btn-out" onclick="closeModal()">${t('cancel')}</button></div>
  `);
}

}

  {key:'contractAgreementPage',label:'Contract Agreement Page',accept:'.pdf',icon:'📄',hint:'PDF'},

  {key:'sitePhotos',label:'Site Photos',accept:'.jpeg,.jpg,.png',icon:'📷',hint:`Images — up to ${MAX_SITE_PHOTOS}`,multi:true},
];
function docSlotHTML(slot,existing){
  const id='us-'+slot.key;
  const hasFile=slot.multi?(existing&&existing.length>0):!!existing;
  const nameText=slot.multi?(hasFile?`${existing.length} file(s) on record`:slot.hint):(existing?.name||slot.hint);
  return `<div class="upload-slot ${hasFile?'has-file':''}" id="${id}">
    <input type="file" accept="${slot.accept}" ${slot.multi?'multiple':''} onchange="handleUpload('${id}','${slot.key}',this)">
    <div class="up-icon">${hasFile?'✅':slot.icon}</div>
    <div class="up-label">${slot.label}</div>
    <div class="up-name" id="un-${slot.key}">${nameText}</div>
  </div>`;
}
function docSlotsHTML(p={}){
  return `<div class="upload-grid">${NCB_DOC_SLOTS.map(s=>docSlotHTML(s,p.files?.[s.key])).join('')}</div>`;
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Could not read '+file.name));
    reader.readAsDataURL(file);
  });
}
async function handleUpload(slotId,key,input){
  if(!input.files.length) return;
  const slotDef=NCB_DOC_SLOTS.find(s=>s.key===key);
  const isMulti=!!slotDef?.multi;
  const slotEl=document.getElementById(slotId), nameEl=document.getElementById('un-'+key);
  if(key==='sitePhotos'){
    const already=(_uploadedFiles.sitePhotos||[]).length;
    if(already+input.files.length>MAX_SITE_PHOTOS){
      toast(`Maximum ${MAX_SITE_PHOTOS} site photos allowed (${already} already added)`,'var(--red)');
      input.value=''; return;
    }
  }
  if(nameEl) nameEl.textContent='Uploading…';
  try{
    const fileArr=await Promise.all([...input.files].map(async f=>({
      name:f.name, size:f.size, type:f.type, data:await readFileAsDataURL(f),
    })));
    if(isMulti){
      _uploadedFiles[key]=[...(_uploadedFiles[key]||[]),...fileArr];
      if(nameEl) nameEl.textContent=`${_uploadedFiles[key].length} file(s) ready to save`;
    } else {
      _uploadedFiles[key]=fileArr[0];
      if(nameEl) nameEl.textContent=fileArr[0].name;
    }
    if(slotEl) slotEl.classList.add('has-file');
    const iconEl=slotEl?.querySelector('.up-icon'); if(iconEl) iconEl.textContent='✅';
  }catch(e){
    console.error('File read failed',e);
    toast('Could not read that file — it may be too large for this browser','var(--red)');
  }
  input.value='';
}

  const isSA=CU.role==='superadmin';
  if(!v('pj-name')){toast('Project name required','var(--red)');return;}
  const list=PROJ_LABELS[ptype].get();
  const existing=editId?list.find(x=>x.id===editId):{};
  const merged=Object.assign({},existing.files||{},_uploadedFiles);

  let proj;

    const typeSel=document.getElementById('pj-type');

      fiscalYear:v('pj-fiscalYear')||CFY,

      activityNo:v('pj-activityNo'),

      budget:parseFloat(v('pj-budget'))||0,
      estimate:parseFloat(v('pj-estimate'))||0,
      contractNo:v('pj-contractNo'),
      contractorName:v('pj-contractorName'), contractorNameNp:v('pj-contractorNameNp'),
      pan:v('pj-pan'),
      proprietorName:v('pj-proprietorName'), proprietorNameNp:v('pj-proprietorNameNp'),
      proprietorPhone:v('pj-proprietorPhone'),
      email:v('pj-email'),
      pgBank:v('pgBank'), pgDistrict:v('pgDistrict'), pgBranch:v('pgBranch'),
      pgGuaranteeNo:v('pgGuaranteeNo'), pgIssueDate:v('pgIssueDate'), pgExpireDate:v('pgExpireDate'),

      officer:v('pj-officer'), officerNp:v('pj-officerNp'),
      status:v('pj-status'),
      remarks:v('pj-remarks'), remarksNp:v('pj-remarksNp'),
      files:merged,
    };
    // legacy fields not used in the NCB form anymore
    delete proj.budgetCode; delete proj.expenseCode; delete proj.accountNo; delete proj.contractAmt;
  } else {
    proj={
      ...(existing||{}),
      id:editId||uid(),
      officeId:isSA?(v('pj-office')||null):(CU.officeId||null),
      fiscalYear:v('pj-fiscalYear')||CFY,
      name:v('pj-name'), nameNp:v('pj-nameNp'),
      type:v('pj-type'),
      pan:v('pj-pan'), activityNo:v('pj-activityNo'),
      budgetCode:v('pj-budgetCode'), expenseCode:v('pj-expenseCode'), accountNo:v('pj-accountNo'),
      estimate:parseFloat(v('pj-estimate'))||0,
      contractAmt:parseFloat(v('pj-contractAmt'))||0,
      contractDate:v('pj-contractDate'), deadline:v('pj-deadline'),
      officer:v('pj-officer'),
      status:v('pj-status'),
      progress:(parseFloat(v('pj-progress'))||0)/100,
      files:merged,
    };
  }
  if(editId){ const i=list.findIndex(x=>x.id===editId); if(i>=0) list[i]=proj; }
  else list.push(proj);
  PROJ_LABELS[ptype].set(list); closeModal(); nav(ptype); toast('Project saved ✅');
}

function deleteProject(ptype,id){
  if(!confirm('Delete this project?')) return;
  PROJ_LABELS[ptype].set(PROJ_LABELS[ptype].get().filter(p=>p.id!==id));
  nav(ptype); toast('Project deleted');
}

// ════════════════════════════════════════════════════════
//  EMPLOYEES
// ════════════════════════════════════════════════════════
function renderEmployees(){
  if(!hasAccess('employees')) return '<div class="empty-state"><div class="es-icon">🔒</div><div>Access Denied</div><p>Contact your admin to enable access</p></div>';
  const emps=filterByOffice(gEmp());
  return `<div class="page-header">
    <div><div class="page-title">${t('employees')}</div><div class="page-sub">${emps.length} staff members</div></div>
    ${canEdit()?`<button class="btn btn-pr" onclick="openAddEmployee()">+ ${t('addEmployee')}</button>`:''}
  </div>
  <div class="filter-bar">
    <div class="search-wrap"><input class="search-box" id="emp-search" placeholder="Search employees..." oninput="filterEmps()"></div>
    ${CU.role==='superadmin'?`<select class="filter-select" id="emp-office-filter" onchange="filterEmps()">
      <option value="">All Offices</option>${gO().map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}
    </select>`:''}
  </div>
  <div id="emp-list">${renderEmpCards(emps)}</div>`;
}

function renderEmpCards(emps){
  if(!emps.length) return '<div class="empty-state"><div class="es-icon">👤</div><div>No employees found</div></div>';
  return emps.map(e=>{
    const ph=e.phone?`<a class="contact-btn cb-call" href="tel:${e.phone}" title="Call">📞</a><a class="contact-btn cb-sms" href="sms:${e.phone}" title="SMS">💬</a>`:'';
    const em=e.email?`<a class="contact-btn cb-mail" href="mailto:${e.email}" title="Email">📧</a>`:'';
    return `<div class="card">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="user-avatar" style="width:44px;height:44px;font-size:18px;background:${avatarColor(e.name)};border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none">${e.name[0]}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px">${e.name}</div>
          ${e.nameNp?`<div style="font-size:11px;color:var(--text2)">${e.nameNp}</div>`:''}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
            ${e.title?`<span class="tag tag-blue">${e.title}${e.titleNp?' / '+e.titleNp:''}</span>`:''}
            ${e.classLevel?`<span class="tag tag-purple">${e.classLevel}${e.classLevelNp?' / '+e.classLevelNp:''}</span>`:''}
            ${e.dept?`<span class="tag tag-purple">${e.dept}</span>`:''}
            ${CU.role==='superadmin'?`<span class="tag tag-orange" style="font-size:10px">${officeName(e.officeId)}</span>`:''}
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--text2);display:flex;flex-direction:column;gap:3px">
            ${e.symbolNo?`<span>🔖 Symbol No: ${e.symbolNo}</span>`:''}
            ${e.serviceGroup?`<span>🗂️ ${e.serviceGroup}${e.serviceGroupNp?' / '+e.serviceGroupNp:''}</span>`:''}
            ${e.joiningDate?`<span>📅 Joined: ${e.joiningDate}</span>`:''}
            ${e.phone?`<span>📞 ${e.phone}</span>`:''}
            ${e.email?`<span>📧 ${e.email}</span>`:''}
            ${e.bank?`<span>🏦 ${e.bank}</span>`:''}
            ${e.remarks?`<span>📝 ${e.remarks}${e.remarksNp?' / '+e.remarksNp:''}</span>`:''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <div class="contact-btns">${ph}${em}</div>
          ${canEdit()?`<div style="display:flex;gap:5px">
            <button class="btn btn-sm btn-out" onclick="openEditEmployee('${e.id}')">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteEmployee('${e.id}')">🗑️</button>
          </div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterEmps(){
  const q=(document.getElementById('emp-search')?.value||'').toLowerCase();
  const off=document.getElementById('emp-office-filter')?.value||'';
  let emps=filterByOffice(gEmp());
  if(q) emps=emps.filter(e=>e.name.toLowerCase().includes(q)||(e.dept||'').toLowerCase().includes(q)||(e.title||'').toLowerCase().includes(q));
  if(off) emps=emps.filter(e=>e.officeId===off);
  const el=document.getElementById('emp-list');
  if(el) el.innerHTML=renderEmpCards(emps);
}

function empForm(e={}){
  const isSA=CU.role==='superadmin';
  const officeFieldHTML=isSA
    ? `<select id="em-office">${gO().map(o=>`<option value="${o.id}" ${o.id===e.officeId?'selected':''}>${o.name}${o.nameNp?' / '+o.nameNp:''}</option>`).join('')}</select>`
    : `<input value="${officeName(CU.officeId)}${(()=>{const o=gO().find(o=>o.id===CU.officeId); return o?.nameNp?' / '+o.nameNp:'';})()}" disabled style="opacity:.7">`;
  return `<div class="theme-purple">
    <div class="fg"><label>Ministry / Office Name</label>${officeFieldHTML}</div>

    <div class="grid2">
      <div class="fg"><label>Employee's Full Name (English)</label><input id="em-name" value="${e.name||''}" placeholder="Full name"></div>
      <div class="fg"><label>Employee's Full Name (Nepali)</label><input id="em-nameNp" value="${e.nameNp||''}" placeholder="पूरा नाम"></div>
    </div>

    <div class="fg"><label>Symbol Number</label><input id="em-symbolNo" value="${e.symbolNo||''}" placeholder="Symbol no."></div>

    <div class="grid2">
      <div class="fg"><label>Position (English)</label><input id="em-title" value="${e.title||''}" placeholder="e.g. Engineer"></div>
      <div class="fg"><label>Position (Nepali)</label><input id="em-titleNp" value="${e.titleNp||''}" placeholder="जस्तै: इन्जिनियर"></div>
    </div>

    <div class="fg"><label>Initial Appointment Date</label><input type="date" id="em-firstAppt" value="${e.firstAppt||''}"></div>

    <div class="grid2">
      <div class="fg"><label>Service / Group / Sub-group (English)</label><input id="em-serviceGroup" value="${e.serviceGroup||''}" placeholder="e.g. Engineering Service, Civil Group"></div>
      <div class="fg"><label>Service / Group / Sub-group (Nepali)</label><input id="em-serviceGroupNp" value="${e.serviceGroupNp||''}" placeholder="जस्तै: इन्जिनियरिङ सेवा, सिभिल समूह"></div>
    </div>

    <div class="grid2">
      <div class="fg"><label>Class / Level (English)</label><input id="em-classLevel" value="${e.classLevel||''}" placeholder="e.g. Level 8"></div>
      <div class="fg"><label>Class / Level (Nepali)</label><input id="em-classLevelNp" value="${e.classLevelNp||''}" placeholder="जस्तै: तह ८"></div>
    </div>

    <div class="grid2">
      <div class="fg"><label>Date of Birth</label><input type="date" id="em-dob" value="${e.dob||''}"></div>
      <div class="fg"><label>Joining Date</label><input type="date" id="em-joiningDate" value="${e.joiningDate||''}"></div>
    </div>
    <div class="grid2">
      <div class="fg"><label>Email</label><input id="em-email" value="${e.email||''}" placeholder="email"></div>
      <div class="fg"><label>Phone Number</label><input id="em-phone" value="${e.phone||''}" placeholder="98XXXXXXXX"></div>
    </div>

    <div class="grid2">
      <div class="fg"><label>Remarks (English)</label><textarea id="em-remarks" rows="3" placeholder="Additional notes...">${e.remarks||''}</textarea></div>
      <div class="fg"><label>Remarks (Nepali)</label><textarea id="em-remarksNp" rows="3" placeholder="थप जानकारी...">${e.remarksNp||''}</textarea></div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-out" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-pr" onclick="saveEmployee('${e.id||''}')">${t('save')}</button>
    </div>
  </div>`;
}

function openAddEmployee(){ openModal(t('addEmployee'),empForm()); }
function openEditEmployee(id){ const e=gEmp().find(x=>x.id===id); if(e) openModal('Edit — '+e.name,empForm(e)); }

function saveEmployee(editId){
  const v=id=>document.getElementById(id)?.value?.trim();
  if(!v('em-name')){toast('Name required','var(--red)');return;}
  const isSA=CU.role==='superadmin';
  const emps=gEmp();
  const existing=editId?emps.find(x=>x.id===editId):{};
  const obj={
    ...(existing||{}),
    id:editId||uid(),
    name:v('em-name'), nameNp:v('em-nameNp'),
    symbolNo:v('em-symbolNo'),
    title:v('em-title'), titleNp:v('em-titleNp'),
    firstAppt:v('em-firstAppt'),
    serviceGroup:v('em-serviceGroup'), serviceGroupNp:v('em-serviceGroupNp'),
    classLevel:v('em-classLevel'), classLevelNp:v('em-classLevelNp'),
    dob:v('em-dob'),
    joiningDate:v('em-joiningDate'),
    email:v('em-email'),
    phone:v('em-phone'),
    remarks:v('em-remarks'), remarksNp:v('em-remarksNp'),
    officeId:isSA?(v('em-office')||null):(CU.officeId||null),
  };
  if(editId){ const i=emps.findIndex(x=>x.id===editId); if(i>=0) emps[i]=obj; }
  else emps.push(obj);
  sEmp(emps); closeModal(); nav('employees'); toast('Employee saved ✅');
}

function deleteEmployee(id){
  if(!confirm('Delete this employee?')) return;
  sEmp(gEmp().filter(e=>e.id!==id)); nav('employees'); toast('Employee deleted');
}

// ════════════════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════════════════
function openModal(title,body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').classList.add('open');
  document.body.classList.add('no-scroll');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); document.body.classList.remove('no-scroll'); }
function modalBg(e){ if(e.target===document.getElementById('modal')) closeModal(); }

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
function dismissBootWarning(){
  document.getElementById('boot-loading').style.display='none';
  if(window.innerWidth<=640) document.getElementById('sidebar-toggle').style.display='flex';
}
(async function boot(){
  const bootEl=document.getElementById('boot-loading');
  const spinEl=document.getElementById('boot-spinner');
  const msgEl=document.getElementById('boot-msg');
  const errEl=document.getElementById('boot-error');
  const contBtn=document.getElementById('boot-continue');
  try{
    await loadDB();
    seedIfEmpty();
  }catch(e){
    console.error(e);
    spinEl.style.display='none';
    msgEl.textContent='Could not connect to the server.';
    errEl.style.display='block';
    errEl.textContent=e.message || 'Check your internet connection and the firebaseConfig values, then reload this page.';
    return; // stop here — do not reveal login on a failed/undefined DB
  }
  if(!CLOUD_OK){
    spinEl.style.display='none';
    contBtn.style.display='block';
    errEl.style.display='block';
    if(FB_INIT_ERROR){
      msgEl.textContent='⚠️ Could not load the cloud database engine';
      errEl.textContent=FB_INIT_ERROR+' — you can still use this device offline, but data will NOT sync with other computers until this loads.';
    } else {
      msgEl.textContent='⚠️ No cloud database configured yet';
      errEl.textContent='Data added right now will only be saved on THIS device/browser — it will not show up on other computers. Ask whoever set this up to add the firebaseConfig values near the top of the script, then reload.';
    }
    return; // wait for the person to actually read this before entering the app
  }
  bootEl.style.display='none';
  if(window.innerWidth<=640) document.getElementById('sidebar-toggle').style.display='flex';
})();
</script>
